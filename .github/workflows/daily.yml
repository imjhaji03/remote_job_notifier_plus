name: Daily Job Digest (EU Remote Java/Spring)

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TEMP: sanity check which items are set (no values printed)
      - name: Check required SMTP items (set vs missing)
        run: |
          test -n "${{ secrets.SMTP_HOST || vars.SMTP_HOST }}" && echo "SMTP_HOST: set" || echo "SMTP_HOST: MISSING"
          test -n "${{ secrets.SMTP_PORT || vars.SMTP_PORT }}" && echo "SMTP_PORT: set" || echo "SMTP_PORT: MISSING"
          test -n "${{ secrets.SMTP_USER || vars.SMTP_USER }}" && echo "SMTP_USER: set" || echo "SMTP_USER: MISSING"
          test -n "${{ secrets.SMTP_PASS || vars.SMTP_PASS }}" && echo "SMTP_PASS: set" || echo "SMTP_PASS: MISSING"
          test -n "${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}" && echo "EMAIL_FROM: set" || echo "EMAIL_FROM: MISSING"
          test -n "${{ secrets.EMAIL_TO || vars.EMAIL_TO }}" && echo "EMAIL_TO: set" || echo "EMAIL_TO: MISSING"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notifier
        env:
          # SMTP (Secrets first, then Variables). Fallback ports included.
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO   || vars.EMAIL_TO   }}

          # Optional feeds
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID  || vars.ADZUNA_APP_ID  }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY || vars.ADZUNA_APP_KEY }}

          # Optional Gmail alerts (with default IMAP_PORT)
          IMAP_HOST:  ${{ secrets.IMAP_HOST  || vars.IMAP_HOST  }}
          IMAP_PORT:  ${{ secrets.IMAP_PORT  || vars.IMAP_PORT  || '993' }}
          IMAP_USER:  ${{ secrets.IMAP_USER  || vars.IMAP_USER  }}
          IMAP_PASS:  ${{ secrets.IMAP_PASS  || vars.IMAP_PASS  }}
          IMAP_LABEL: ${{ secrets.IMAP_LABEL || vars.IMAP_LABEL }}

          PYTHONUNBUFFERED: "1"
        run: python job_notifier.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/jobs_seen.json || true
          git commit -m "chore: update seen jobs [skip ci]" || echo "No changes"
          git push || true
